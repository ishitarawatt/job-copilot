name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Unit tests (includes demo/Python parity)
        run: python -m pytest -q
        env:
          REQUIRE_NODE: "1"          # fail, don't skip, if the parity test cannot run
      - name: Evals and safety gates (offline mock model)
        run: PYTHONPATH=src python evals/run_evals.py
